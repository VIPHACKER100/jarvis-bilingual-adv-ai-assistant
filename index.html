<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JARVIS AI | Bilingual Personal Assistant</title>
    <meta name="description" content="JARVIS — A premium bilingual AI assistant with voice control, automation, and system management." />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#090f11" />
    <meta name="application-name" content="JARVIS AI" />
    <meta name="robots" content="index, follow" />
    <link rel="icon" href="/favicon.ico" type="image/x-icon" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Rajdhani:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

    <link rel="stylesheet" href="/src/styles/index.css" />
    <script type="module" src="/src/main.tsx"></script>

    <style>
      .jarvis-boot-loader {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #090f11;
        gap: 24px;
        transition: opacity 0.6s ease, visibility 0.6s ease;
      }
      .jarvis-boot-loader--hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      .boot-ring {
        width: 48px;
        height: 48px;
        border-radius: 50%;
        border: 2px solid rgba(76, 215, 246, 0.15);
        border-top-color: #4cd7f6;
        animation: boot-spin 1s cubic-bezier(0.19, 1, 0.22, 1) infinite;
      }
      .boot-text {
        font-family: 'JetBrains Mono', monospace;
        font-size: 11px;
        letter-spacing: 0.15em;
        text-transform: uppercase;
        color: rgba(222, 227, 230, 0.5);
      }
      @keyframes boot-spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div class="jarvis-boot-loader" id="boot-loader">
      <div class="boot-ring"></div>
      <div class="boot-text">Initializing JARVIS Neural Core...</div>
    </div>

    <div id="root"></div>

    <div class="scanline-overlay"></div>

    <script>
      window.addEventListener('load', () => {
        const loader = document.getElementById('boot-loader');
        if (loader) {
          setTimeout(() => {
            loader.classList.add('jarvis-boot-loader--hidden');
            setTimeout(() => loader.remove(), 700);
          }, 600);
        }
      });
    </script>
  </body>
</html>
