name: CI

on:
  push:
    branches: [main, develop]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'memory/**'
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  PYTHON_VERSION: '3.12'
  FORCE_COLOR: '1'

jobs:
  frontend-lint-typecheck:
    name: Frontend — Lint & Typecheck (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [18.x, 20.x, 22.x]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - run: npm ci

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: Markdown lint
        run: npx markdownlint-cli '**/*.md' --ignore node_modules --ignore backend/venv

      - name: Check build
        run: npm run build

      - name: npm audit
        continue-on-error: true
        run: npm audit --audit-level=high

  backend-lint:
    name: Backend — Lint (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          pip install --upgrade pip
          pip install ruff mypy pip-audit
          pip install -r requirements.txt

      - name: Ruff lint check
        working-directory: backend
        run: ruff check --config '{"line-length": 120, "select": ["E", "F", "W", "I", "N", "UP", "B", "SIM", "ARG"], "ignore": ["E501"]}'

      - name: Import check
        working-directory: backend
        run: python -c "import main; import models; print('Backend imports OK')"

      - name: pip-audit
        continue-on-error: true
        run: pip-audit --desc on -r backend/requirements.txt

  test:
    name: Tests — ${{ matrix.component }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component: [frontend, backend]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node (frontend)
        if: matrix.component == 'frontend'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install frontend deps
        if: matrix.component == 'frontend'
        run: npm ci

      - name: Run frontend tests
        if: matrix.component == 'frontend'
        run: npx vitest run --coverage.enabled=false

      - name: Setup Python (backend)
        if: matrix.component == 'backend'
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install backend deps
        if: matrix.component == 'backend'
        working-directory: backend
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx

      - name: Run backend tests
        if: matrix.component == 'backend'
        working-directory: backend
        run: python -m pytest tests/ -v --timeout=30 -x --ignore=venv
        continue-on-error: true

  dependency-scan:
    name: Dependency — Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - run: npm ci

      - name: npm audit (strict)
        run: npm audit --audit-level=high

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: pip-audit (strict)
        run: |
          pip install pip-audit
          pip-audit --desc on -r backend/requirements.txt --strict

  docker-build:
    name: Docker — Build Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.backend
          push: false
          tags: jarvis-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.frontend
          push: false
          tags: jarvis-frontend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build combined image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: false
          tags: jarvis-combined:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  security-scan:
    name: Security — Scan
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'HIGH,CRITICAL'
          exit-code: '1'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

  deploy:
    name: Deploy
    if: github.ref == 'refs/heads/main'
    needs: [frontend-lint-typecheck, backend-lint, test, dependency-scan, docker-build, security-scan]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and push Docker images
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.backend
          push: true
          tags: ghcr.io/${{ github.repository }}/backend:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Deploy notification
        run: echo "Deployment would trigger here"
