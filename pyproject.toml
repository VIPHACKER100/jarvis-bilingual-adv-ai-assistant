[project]
requires-python = ">=3.11"

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
# Bug-catching rules enforced as CI gate. UP/SIM/N/ARG (style modernization:
# ~600 findings of typing.Dict→dict, naming, unused-arg style) are disabled as
# tracked debt — re-enable and run `ruff check --fix` in a dedicated pass.
select = ["E", "F", "W", "I", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["backend/tests"]

[tool.coverage.run]
source = ["."]
omit = ["*/tests/*", "*/venv/*", "*/__pycache__/*"]
